# Reduced from -Xmx8G to -Xmx4G to prevent memory exhaustion on repeated builds
# The build script now stops daemons after each build to reclaim memory
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin daemon memory limit (was inheriting -Xmx8G default)
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
